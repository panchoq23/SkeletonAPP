<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Nueva Pregunta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card class="create-card">
    <ion-card-header>
      <ion-card-title>¿Qué duda tienes hoy?</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-item lines="full" class="form-item">
        <ion-label position="stacked">Título de la duda <span class="required">*</span></ion-label>
        <ion-input [(ngModel)]="newPost.title" placeholder="Ej: Error al inicializar SQLite en Android"></ion-input>
      </ion-item>

      <ion-item lines="full" class="form-item">
        <ion-label position="stacked">Categoría <span class="required">*</span></ion-label>
        <ion-select [(ngModel)]="newPost.category" placeholder="Selecciona un área" interface="popover">
          <ion-select-option *ngFor="let cat of categories" [value]="cat">{{ cat }}</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item lines="full" class="form-item">
        <ion-label position="stacked">Descripción detallada <span class="required">*</span></ion-label>
        <ion-textarea [(ngModel)]="newPost.body" rows="5" placeholder="Explica tu problema con detalle para recibir mejores respuestas..."></ion-textarea>
      </ion-item>

      <ion-button expand="block" fill="outline" color="secondary" class="photo-btn" (click)="takePhoto()">
        <ion-icon slot="start" name="camera"></ion-icon>
        {{ photo ? "Cambiar imagen adjunta" : "Adjuntar imagen (opcional)" }}
      </ion-button>

      <div *ngIf="photo" class="photo-preview">
        <img [src]="photo" alt="Imagen adjunta" />
      </div>

      <ion-button expand="block" class="publish-btn" [disabled]="enviando" (click)="createPost()">
        <ion-spinner *ngIf="enviando" name="crescent" slot="start"></ion-spinner>
        <ion-icon *ngIf="!enviando" slot="start" name="send-outline"></ion-icon>
        {{ enviando ? "Publicando..." : "Publicar en el Foro" }}
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
