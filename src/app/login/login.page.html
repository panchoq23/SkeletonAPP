<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Login</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="login-container">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Ingrese sus credenciales</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <!-- Campo Usuario -->
        <div class="form-group">
          <ion-label>Usuario</ion-label>
          <ion-input
            [(ngModel)]="usuario"
            placeholder="3-8 caracteres alfanuméricos"
            type="text"
            maxlength="8">
          </ion-input>
          <div class="error-text" *ngIf="usuarioError">
            {{ usuarioError }}
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div class="form-group">
          <ion-label>Contraseña</ion-label>
          <ion-input
            [(ngModel)]="contrasena"
            placeholder="4 dígitos"
            type="password"
            maxlength="4">
          </ion-input>
          <div class="error-text" *ngIf="contrasenaError">
            {{ contrasenaError }}
          </div>
        </div>

        <!-- Botones -->
        <ion-button expand="block" color="primary" (click)="ingresar()">
          Ingresar
        </ion-button>
        <ion-button expand="block" color="secondary" (click)="registrar()">
          Registrarse
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
