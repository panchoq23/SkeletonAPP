<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Home</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="home-container">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Bienvenido {{ usuario }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <!-- Campo Nombre -->
        <div class="form-group">
          <ion-label>Nombre</ion-label>
          <ion-input 
            [(ngModel)]="nombre" 
            placeholder="Ingrese su nombre"
            type="text">
          </ion-input>
        </div>

        <!-- Campo Apellido -->
        <div class="form-group">
          <ion-label>Apellido</ion-label>
          <ion-input 
            [(ngModel)]="apellido" 
            placeholder="Ingrese su apellido"
            type="text">
          </ion-input>
        </div>

        <!-- Campo Nivel de Educación -->
        <div class="form-group">
          <ion-label>Nivel de Educación</ion-label>
          <ion-select [(ngModel)]="nivelEducacion" placeholder="Seleccione nivel">
            <ion-select-option value="primaria">Primaria</ion-select-option>
            <ion-select-option value="secundaria">Secundaria</ion-select-option>
            <ion-select-option value="tecnica">Técnica</ion-select-option>
            <ion-select-option value="universitaria">Universitaria</ion-select-option>
            <ion-select-option value="posgrado">Posgrado</ion-select-option>
          </ion-select>
        </div>

        <!-- Campo Fecha de Nacimiento -->
        <div class="form-group">
          <ion-label>Fecha de Nacimiento</ion-label>
          <ion-input 
            [(ngModel)]="fechaNacimiento" 
            type="date">
          </ion-input>
        </div>

        <!-- Botones -->
        <div class="button-group">
          <ion-button expand="block" color="medium" (click)="limpiar()">
            Limpiar
          </ion-button>
          <ion-button expand="block" color="success" (click)="mostrar()">
            Mostrar
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
