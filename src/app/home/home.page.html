<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>SkeletonAPP - Home</ion-title>
  </ion-toolbar>

  <ion-toolbar color="primary">
    <ion-segment [(ngModel)]="selectedSegment" (ionChange)="segmentChanged($event)">
      <ion-segment-button value="mis-datos">
        <ion-label>Mis Datos</ion-label>
      </ion-segment-button>
      <ion-segment-button value="experiencia">
        <ion-label>Experiencia</ion-label>
      </ion-segment-button>
      <ion-segment-button value="certificaciones">
        <ion-label>Certificaciones</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="welcome-text">
    <h2>Bienvenido, {{ usuario }}</h2>
  </div>

  <div [ngSwitch]="selectedSegment">
    <app-mis-datos
      *ngSwitchCase="'mis-datos'"
      [usuario]="usuario">
    </app-mis-datos>

    <app-experiencia-laboral
      *ngSwitchCase="'experiencia'"
      [usuario]="usuario">
    </app-experiencia-laboral>

    <app-certificaciones
      *ngSwitchCase="'certificaciones'"
      [usuario]="usuario">
    </app-certificaciones>
  </div>
</ion-content>
