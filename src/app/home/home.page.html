<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>DUOC Connect</ion-title>
  </ion-toolbar>

  <ion-toolbar color="primary">
    <ion-segment [(ngModel)]="selectedSegment">
      <ion-segment-button value="foro">
        <ion-label>Foro Académico</ion-label>
      </ion-segment-button>
      <ion-segment-button value="perfil">
        <ion-label>Mi Perfil</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div [ngSwitch]="selectedSegment">

    <!-- Sección Foro (Reddit Style) -->
    <div *ngSwitchCase="'foro'">

      <div *ngFor="let post of posts" class="reddit-card">
        <div class="card-meta">
          <ion-avatar>
            <img src="https://ionicframework.com/docs/img/demos/avatar.svg" />
          </ion-avatar>
          <span>{{ post.author }} · {{ post.timestamp }}</span>
        </div>

        <div class="card-category">{{ post.category }}</div>

        <ion-card-header>
          <ion-card-title>{{ post.title }}</ion-card-title>
        </ion-card-header>

        <ion-card-content>
          {{ post.body }}
        </ion-card-content>

        <div class="card-footer">
          <div class="interaction-item">
            <ion-icon name="thumbs-up-outline"></ion-icon>
            <span>{{ post.votes }}</span>
          </div>
          <div class="interaction-item">
            <ion-icon name="chatbubble-outline"></ion-icon>
            <span>{{ post.repliesCount }} respuestas</span>
          </div>
        </div>
      </div>

      <div *ngIf="posts.length === 0" class="ion-text-center">
        <ion-spinner name="crescent"></ion-spinner>
        <p>Cargando foro...</p>
      </div>

      <ion-fab vertical="bottom" horizontal="end" slot="fixed">
        <ion-fab-button (click)="goToCreate()">
          <ion-icon name="add"></ion-icon>
        </ion-fab-button>
      </ion-fab>
    </div>

    <!-- Sección Perfil -->
    <div *ngSwitchCase="'perfil'">
      <app-mis-datos [usuario]="usuario"></app-mis-datos>
    </div>

  </div>
</ion-content>
