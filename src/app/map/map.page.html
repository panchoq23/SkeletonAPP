<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Sedes DUOC</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="map-container">
    <capacitor-google-map #map></capacitor-google-map>
  </div>

  <div class="info-panel ion-padding">
    <h3 class="panel-title">Explora nuestras sedes</h3>
    <p class="panel-subtitle">Visualiza la sede más cercana a tu ubicación actual.</p>
    
    <ion-list lines="none">
      <ion-item class="location-item">
        <ion-icon slot="start" name="pin-outline" color="primary"></ion-icon>
        <ion-label>
          <h2>Mi Ubicación</h2>
          <p>{{ lat | number:"1.4-4" }}, {{ lng | number:"1.4-4" }}</p>
        </ion-label>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
